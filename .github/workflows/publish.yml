name: Publish to npm

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/publish-v0.3.3

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Test and publish
    if: ${{ github.event_name == 'push' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Verify package version
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
              echo "::error::Release tag $GITHUB_REF_NAME must match package version v$PACKAGE_VERSION."
              exit 1
            fi
          elif [ "$PACKAGE_VERSION" != "0.3.3" ]; then
            echo "::error::One-time publish expected package version 0.3.3, found $PACKAGE_VERSION."
            exit 1
          fi

      - name: Publish package
        run: npm publish --access public --provenance
